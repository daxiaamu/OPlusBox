name: Publish update manifest
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: update-manifest-${{ github.event.release.prerelease && 'beta' || 'stable' }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Download unique release APK
        shell: bash
        run: |
          set -euo pipefail
          asset_id=$(jq -er '[.release.assets[] | select(.name | endswith(".apk"))] | if length == 1 then .[0].id else error("Exactly one APK required") end' "$GITHUB_EVENT_PATH")
          gh api -H 'Accept: application/octet-stream' "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > release.apk
      - name: Validate APK and CDN copies, generate manifest
        run: python3 tools/publish_update.py
      - name: Commit validated manifest
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update/update*.json
          git commit -m 'chore: publish verified update manifest'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
